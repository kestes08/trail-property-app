<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#f3efe4"/>

  <!-- RAKE handle: brown shaft -->
  <path d="M27 29 L70 84" stroke="#7c5535" stroke-width="8" stroke-linecap="round"/>

  <!-- PICK handle: orange, in front at the crossing -->
  <path d="M66 32 L28 86" stroke="#e18a37" stroke-width="8" stroke-linecap="round"/>

  <!-- RAKE fan head (green): bar + five tines -->
  <path d="M10 26 L36 20" stroke="#6f9e5b" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#6f9e5b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M13 25.3 L13 38.3"/>
    <path d="M18.2 24.1 L18.2 37.1"/>
    <path d="M23.4 22.9 L23.4 35.9"/>
    <path d="M28.6 21.7 L28.6 34.7"/>
    <path d="M33.8 20.5 L33.8 33.5"/>
  </g>

  <!-- PICK head (steel), mounted on the handle top with an orange eye -->
  <path d="M63 27 L69 36" stroke="#e18a37" stroke-width="9" stroke-linecap="round"/>
  <path d="M50 14
           C 63 10, 77 17, 88 37
           C 83 35, 77 32, 71 29
           C 62 25, 55 19, 50 14 Z" fill="#a7abaa"/>
</svg>
